# orders-api holds no static secrets: no Secret is mounted, no password is in
# its environment. It proves who it is with a projected service account token
# (audience "vault", 10 minute lifetime) and gets everything else from Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api
  namespace: orders
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-api
spec:
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
    spec:
      serviceAccountName: orders-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-api
          image: orders-api:ci
          imagePullPolicy: IfNotPresent
          env:
            - name: VAULT_ADDR
              value: http://vault-active.vault.svc:8200
            - name: VAULT_ROLE
              value: orders-api
            - name: TLS_COMMON_NAME
              value: orders-api.orders.svc
            - name: TLS_ALT_NAMES
              value: orders-api.orders.svc.cluster.local
            - name: TLS_CERT_TTL
              value: 2m
            - name: DB_DSN
              value: host=postgres.db.svc port=5432 dbname=app sslmode=disable
          ports:
            - name: https
              containerPort: 8443
          startupProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 600
                  path: token
