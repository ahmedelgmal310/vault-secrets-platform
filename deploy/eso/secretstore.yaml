# ESO authenticates to Vault as the orders-eso service account (audience
# "vault"), which maps to the eso-orders role and its one-path policy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-eso
  namespace: orders
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: orders
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-orders
          serviceAccountRef:
            name: orders-eso
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-api-config
  namespace: orders
spec:
  # Short for the demo so rotation is visible within seconds; minutes are
  # typical in production.
  refreshInterval: 5s
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: orders-api-config
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: orders-api/config
        property: api_key
