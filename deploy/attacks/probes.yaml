# Access probes run by e2e/attacks.sh. Each Job is one identity attempting a
# list of operations; vaultprobe exits non-zero if any outcome differs from
# the expectation, so "deny" here is asserted, not hoped for.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intruder
  namespace: orders
automountServiceAccountToken: false
---
# Same name as the real service account, but in another namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api
  namespace: rogue
automountServiceAccountToken: false
---
# 1. The legitimate identity gets exactly its policy and nothing more.
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-least-privilege
  namespace: orders
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultprobe
    spec:
      serviceAccountName: orders-api
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: orders-api:ci
          imagePullPolicy: IfNotPresent
          command: ["/vaultprobe"]
          args:
            - -scenario=least-privilege
            - -role=orders-api
            - -expect-login=allow
            - -check=read|database/creds/orders-api|allow
            - -check=write|pki_int/issue/orders-api|allow|{"common_name":"orders-api.orders.svc","ttl":"60s"}
            - -check=write|transit/encrypt/orders|allow|{"plaintext":"cHJvYmU="}
            - -check=read|kv/data/orders-api/config|deny
            - -check=list|database/roles|deny
            - -check=read|database/config/orders-postgres|deny
            - -check=write|database/rotate-root/orders-postgres|deny|{}
            - -check=write|pki_int/issue/orders-api|deny|{"common_name":"evil.example.com"}
            - -check=write|pki/root/sign-intermediate|deny|{"csr":"x"}
            - -check=write|transit/encrypt/payments|deny|{"plaintext":"cHJvYmU="}
            - -check=write|transit/keys/orders/rotate|deny|{}
            - -check=read|transit/export/encryption-key/orders|deny
            - -check=write|auth/token/create|deny|{}
            - -check=read|sys/audit|deny
            - -check=tcp|postgres.db.svc:5432|deny
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 600
                  path: token
---
