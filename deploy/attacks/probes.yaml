# 5. The right service account, but its default API-server token (as an
# attacker would find it mounted in a compromised pod) instead of the
# audience-bound "vault" token.
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-wrong-audience
  namespace: orders
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultprobe
    spec:
      serviceAccountName: orders-api
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: orders-api:ci
          imagePullPolicy: IfNotPresent
          command: ["/vaultprobe"]
          args:
            - -scenario=wrong-audience
            - -role=orders-api
            - -jwt=/var/run/secrets/kubernetes.io/serviceaccount/token
            - -expect-login=deny
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
